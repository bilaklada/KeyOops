name: Verify KeyOops
on: [push, pull_request]
permissions:
  contents: read

jobs:
  macos:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify conversion and detection
        run: swift run VerifyCore
      - name: Verify inline key handling
        run: |
          swiftc Sources/KeyOops/InlineSuggestion.swift Tests/InlineTests/main.swift -o "$RUNNER_TEMP/VerifyInline"
          "$RUNNER_TEMP/VerifyInline"
      - name: Verify AppKit live edits
        run: swift run VerifyLiveEdit
      - name: Verify Services transactions
        run: swift run VerifyService
      - name: Build and check the app bundle
        run: Scripts/build-app.sh
